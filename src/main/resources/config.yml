# sBank — configurado para DrakesCraft
# Docs: https://github.com/xenrivehub/sbank

database:
  type: sqlite
  host: localhost
  port: 3306
  name: sbank
  username: root
  password: ''

# Guardado automático de cuentas y deudas en base de datos
auto-save: 
  save-interval: 15
  log-settings:
    enabled: true
    message: "&6[DrakesBank]&a All accounts and debts were successfully saved."

# Registro de auditoría JSON
audit:
  enabled: true
  directory: "audit"

default-bank-name: "My Bank"
bank-name-length: 16
start-money: 0
currency-symbol: "₯"

# --- DEATH PENALTY ----------------------------------------
# Money deposited in the bank is always SAFE.
lose-money-after-death: false
after-death-percentage: 0
after-death-message: '&cYou died! Your money on hand is safe. Remember to use the bank (/sb) for convenience.'

messages:
  prefix: '&6[&cDrakesBank&6] &r'
  no-permission: '&cYou do not have permission to do this.'
  plugin-reloaded: '&aPlugin reloaded successfully.'
  no-bank-account: '&cYou do not have a bank account. It will be created automatically upon reconnecting.'
  setting-bank-name: '&6Bank name can only contain letters and numbers (max 16 chars). Enter the new name:'
  bank-name-set: '&aBank name changed to &e%bankname%.'
  not-enough-money: '&cYou do not have enough money to complete this action.'
  deposit-success: '&aDeposited &e%money%₯ &ainto your bank.'
  withdraw-success: '&aWithdrew &e%money%₯ &afrom your bank.'
  enter-amount: '&6Enter the amount to process:'
  custom-amount-not-set: '&cSession cancelled.'
  bank-name-not-set: '&cExited without changing bank name.'
  bank-name-invalid: '&cInvalid name. Only letters and numbers. (type ''close'' to cancel)'
  loan-amount: '&6Enter the loan amount. Minimum &e%minloan%₯ &6and Maximum &e%maxloan%₯. &o(type ''cancel'' to cancel)'
  loan-agreement: '&6You will be charged &c%interest%₯ interest every &c%term% hours. Do you confirm the loan of &e%amount%₯?'
  loan-success: '&aLoan approved: &e%amount%₯. &aYou will pay &c%interest%₯ interest every &c%term% hours. Use &e/sb debt &ato view your debt.'
  loan-failed: '&cLoan process cancelled.'
  loan-paid: '&aPaid &e%amount%₯ &atowards your debt.'
  loan-cancelled: '&cLoan process cancelled.'
  loan-disabled: '&cLoans are disabled.'
  loan-amount-error: '&cThe amount must be between &e%minloan%₯ &cand &e%maxloan%₯.'
  debt-deducted: '&aDeducted &e%money%₯ &afrom your bank to pay your debt.'
  debt-cant-paid: '&cYou do not have enough money to pay your debt! Your debt increased by &e%money%₯.'
  debt-payment-success: '&aPaid &e%money%₯ &atowards your debt.'
  debt-paid: '&aDebt fully paid! You can now apply for another loan.'
  invalid-amount: '&cInvalid amount.'
  less-then-daily: '&cYou must pay at least &e%daily%₯ &cfor minimum payment.'
  loan-agree:
  - '&c----------- Loan Details -----------'
  - '&6Total Loan: &e%total_debt%₯'
  - '&6Payment every &e%payment_interval% hours&6: &c%every_payment%₯'
  - '&6Use &e/sb debt &6to view and pay your debt.'
  - '&6If not paid on time, debt increases by &c%every_payment%₯.'
  - '&c• Payment is automatically deducted from your BANK.'
  - '&c-------------------------------------'

gui:
  bank-home-title: '&6DrakesBank — Your Account'
  deposit-page-title: '&6Deposit Money'
  withdraw-page-title: '&6Withdraw Money'
  loan-page-title: '&6Request Loan'
  debt-page-title: '&6My Debt'
  agree-page-title: '&6Confirm Loan'

# --- PRÉSTAMOS --------------------------------------------
# Requiere permiso: sbank.loan
# El pago de interés se toma del banco automáticamente.
loan:
  enabled: true
  max-loan: 500000.0
  min-loan: 1000.0
  loan-interest: 20 # 20% del monto prestado = interés total a pagar
  loan-term: 7 # período del préstamo en días
  debt-time: 24 # se cobra interés parcial cada 24 horas

# --- INTERÉS EN DEPÓSITOS ---------------------------------
# Requiere permiso: sbank.interest
# 0.5% del balance bancario cada 24 horas — incentivo anti-inflacionario
# (circular: el dinero no se crea, se redistribuye del pool de deudas)
interest:
  enabled: true
  interest-rate: 0.5 # bajado de 4: al 4% diario compuesto el saldo se duplicaba cada ~18 dias
  interest-time: 24 # cada 24 horas
  last-interest-date: '2026-09-12 20:40:55'
  interest-message: '&a+&e%interest%₯ &ainterest credited to your bank.'

# Reserva que respalda los prestamos. Sin fondos aqui, un prestamo no puede crear dinero nuevo.
economy-reserve:
  balance: 5163781.5
  reserve-backed-loans: true

# Impuesto progresivo sobre el saldo GUARDADO en el banco. No toca billetera ni inventario.
# El primer ciclo se agenda despues de un intervalo completo, asi que activarlo no cobra al arrancar.
wealth-tax:
  enabled: true
  interval-hours: 24
  protected-balance: 500000.0
  maximum-charge-per-cycle: 250000.0
  exempt-usernames: []
  last-run: '2026-09-13 00:19:07'
  message: '&6[DrakesBank] &eBank tax applied: &c-%money%'
  tiers:
    first:
      # 0.5% sobre lo que exceda el saldo protegido, hasta 1.000.000.
      up-to: 1000000.0
      rate-percent: 0.5
    second:
      # 1% sobre los siguientes 4.000.000.
      up-to: 5000000.0
      rate-percent: 1.0
    high:
      # 2% sobre el resto de la riqueza gravable.
      up-to: -1
      rate-percent: 2.0
